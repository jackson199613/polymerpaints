# Static site, no build step. Publish directory = repo root.
[build]
  publish = "."

# Assets are versioned by filename: never change a file under the same name, add a new name instead.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/industries/powder-distributors/*"
  to = "/distributors/"
  status = 301

# build/ holds the page generator source; keep it in the repo but not on the website
[[redirects]]
  from = "/build/*"
  to = "/404.html"
  status = 404
  force = true
