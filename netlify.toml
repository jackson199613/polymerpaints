# Static site, no build step. Publish directory = repo root.
[build]
  publish = "."

# Assets are versioned by filename: never change a file under the same name, add a new name instead.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[redirects]]
  from = "/industries/powder-distributors/*"
  to = "/distributors/"
  status = 301

# build/ holds the page generator source; keep it in the repo but not on the website
[[redirects]]
  from = "/build/*"
  to = "/404.html"
  status = 404
  force = true

# Form auto-reply (netlify/functions/submission-created.mjs). Set SMTP_USER and SMTP_PASS in Netlify.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# function source and package files are not web pages
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
